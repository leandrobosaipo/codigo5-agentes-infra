name: Validate infrastructure

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  planning-validation:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Parse Windows PowerShell sources
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($_.Name + ': ' + ($parseErrors.Message -join '; ')) }
          }
          Get-Content config/lab.example.json -Raw | ConvertFrom-Json | Out-Null
      - name: Validate planning and refusal fixtures without Hyper-V effects
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Test-NewLabVM.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
